<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3460" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0f16" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>학점 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<style>
:root{
  color-scheme:dark light;
  --bg:#0c0f16; --surface:#151a24; --surface2:#1d2431; --bar:#0f1420;
  --ink:#e7ebf4; --ink2:#adb9ce; --ink3:#7f8ca4;
  --rule:#262d3c; --navy:#93b7ea; --crimson:#ff8098;
  --gold:#efc366; --gold-bg:#2b2413; --green:#66d3a6;
  --done:#7fabe2; --doing:#3d63a0; --todo:#242b39;
  --nav-h:62px;
  --font:"Pretendard Variable",Pretendard,"Samsung Sans","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f3f5f9; --surface:#fff; --surface2:#e9eef6; --bar:#fff;
  --ink:#111726; --ink2:#3f4d66; --ink3:#5f6c82;
  --rule:#dbe1ec; --navy:#0f3460; --crimson:#bc1738;
  --gold:#8a5b00; --gold-bg:#fdf4dc; --green:#0d6b49;
  --done:#0f3460; --doing:#2f6db5; --todo:#d9e0ea;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
     word-break:keep-all;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app *{margin:0}

/* ── 앱바 ── */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--rule);
     padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
.bar .ttl{font-size:17px;font-weight:700;letter-spacing:-.01em}
.bar .sub{font-size:11px;color:var(--ink3);margin-top:1px!important}
.bar .sp{flex:1}
.pill{font:600 12px/1 var(--font);padding:9px 13px;border-radius:999px;border:1px solid var(--rule);
      background:var(--surface);color:var(--ink);cursor:pointer}
.pill.go{background:var(--navy);color:var(--bg);border-color:transparent}
/* hidden 속성이 항상 이기게 둡니다.
   .offline 에 display:flex 를 주는 바람에 브라우저 기본 [hidden]{display:none} 이 밀려서
   온라인인데도 '오프라인' 배지가 계속 떠 있었습니다(작성자 CSS 가 UA 기본을 항상 이깁니다).
   개별 선택자로 한 곳씩 막다 보면 또 빠뜨립니다 — 전역으로 한 번에 못박습니다. */
[hidden]{display:none!important}
.net{font-size:11px;display:flex;align-items:center;gap:5px;color:var(--green)}
.net .nd{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.net.off{color:var(--gold)}
.net.off .nd{background:var(--gold)}

/* ── 본문 ── */
main{padding:14px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);
     max-width:600px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px}
.card + .card,.card + .reqs,.reqs + .card,h2 + .card,h2 + .list,h2 + .sch{margin-top:10px}

.hero{display:flex;align-items:baseline;gap:9px}
.hero .n{font-family:var(--num);font-size:46px;font-weight:700;letter-spacing:-.05em;line-height:1}
.hero .of{font-size:15px;color:var(--ink3);font-family:var(--num)}
.hero .tag{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink3)}
.bar2{display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--todo);margin-top:14px}
.bar2 i{display:block;transition:flex-grow .4s cubic-bezier(.2,.8,.2,1)}
.bar2 .d{background:var(--done)}.bar2 .g{background:var(--doing)}
.keys{display:flex;flex-wrap:wrap;gap:6px 15px;margin-top:11px!important;font-size:12px;color:var(--ink2)}
.keys span{display:flex;align-items:center;gap:6px}
.keys b{font-family:var(--num);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

.reqs{display:grid;gap:8px}
.req{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:13px 15px}
.req .h{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--ink2)}
.req .h b{margin-left:auto;font-family:var(--num);font-size:16px;color:var(--ink)}
/* 게이지는 3층입니다 — 확보(인정완료) / 신청하면 / 계획대로 가면.
   확보만 보여주면 신청해도 화면이 안 움직여서 진행이 안 보입니다. */
.req .track{height:9px;border-radius:5px;background:var(--todo);margin-top:9px;overflow:hidden;display:flex}
.req .track i{display:block;height:100%;background:var(--done);transition:flex-grow .4s cubic-bezier(.2,.8,.2,1)}
.req .track i.g{background:var(--doing)}
.req .track i.p{background:var(--rule)}
.req .now{font-size:11.5px;color:var(--ink2);margin-top:7px!important}
.req .now b{font-family:var(--num);color:var(--ink)}
.fore{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.fore th{font-size:11px;font-weight:700;color:var(--ink3);text-align:right;padding:0 0 7px;letter-spacing:.04em}
.fore th:first-child{text-align:left}
.fore td{font-size:13px;padding:9px 0;border-top:1px solid var(--rule);text-align:right}
.fore td:first-child{text-align:left;color:var(--ink2)}
.fore td b{font-family:var(--num);font-size:15px}
.fore tr.fin td{border-top:2px solid var(--ink);font-weight:700}
.fore .plus{font-family:var(--num);color:var(--doing);font-size:12px}
.req.met .track i:first-child{background:var(--green)}
.req.short{border-color:var(--crimson)}
.req.short .track i:first-child{background:var(--crimson)}
.req .note{font-size:11.5px;color:var(--ink3);margin-top:7px!important}

h2{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--ink3);margin:20px 2px 8px!important}

.next{background:var(--surface);border:1px solid var(--gold);border-left:6px solid var(--gold);border-radius:16px;padding:16px 18px}
.next .d{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--crimson)}
.next .t{font-size:18px;font-weight:700;line-height:1.4;color:var(--ink);margin-top:5px!important}
.next .b{font-size:14px;line-height:1.75;color:var(--ink);margin-top:11px!important;white-space:pre-line}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;font:600 13px/1 var(--font);padding:9px 15px;border-radius:999px;cursor:pointer;
       border:1px solid var(--rule);background:var(--surface);color:var(--ink2)}
.fchip[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:transparent}

.list,.sch{background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:64px;
      padding:13px 15px;background:none;border:0;border-bottom:1px solid var(--rule);
      cursor:pointer;font:inherit;color:inherit}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface2)}
.item[hidden]{display:none}
/* 기본(예정) 라벨은 작은 굵은 글자라 대비가 4.5 이상이어야 합니다.
   --ink3 을 쓰니 라이트 모드에서 3.4 로 떨어졌습니다(검수에서 잡음). --ink2 로 올렸습니다. */
.mark{flex:none;min-width:62px;text-align:center;padding:6px 9px;border-radius:8px;
      font-size:11.5px;font-weight:700;line-height:1.2;
      color:var(--ink2);background:var(--todo);transition:background .2s,color .2s}
.item[data-s="인정완료"] .mark{background:var(--done);color:var(--bg)}
/* 파란 배경에 배경색 글씨를 얹었더니 대비가 2.6까지 떨어졌습니다(검수에서 잡음).
   흰 글씨로 바꾸고 라이트 모드의 --doing 을 진하게 내렸습니다. */
.item[data-s="신청완료"] .mark{background:var(--doing);color:#fff}
.item[data-s="취소예정"] .mark{background:var(--crimson);color:var(--bg)}
.item[data-s="취소완료"] .mark{background:var(--rule);color:var(--ink3)}
.item[data-s="취소완료"] .nm .n1,.item[data-s="취소완료"] .cr{text-decoration:line-through;color:var(--ink3)}
.cancel{font-size:10px;font-weight:700;color:var(--crimson);border:1px solid var(--crimson);
        border-radius:999px;padding:2px 7px}
.nm{flex:1;min-width:0}
.nm .n1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm .n2{font-size:11.5px;color:var(--ink3);margin-top:2px!important}
.item[data-s="인정완료"] .nm .n1{color:var(--ink2)}
.cr{font-family:var(--num);font-weight:700;font-size:17px;flex:none}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid currentColor}
.c-전공{color:var(--navy)}.c-교양{color:var(--crimson)}.c-일반{color:var(--ink3)}
.hoh{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold);
     border-radius:999px;padding:2px 7px}

.srow{width:100%;text-align:left;display:flex;gap:12px;padding:14px 15px;font:inherit;color:inherit;
      background:none;border:0;border-bottom:1px solid var(--rule);cursor:pointer}
.srow:last-child{border-bottom:0}
.srow:active{background:var(--surface2)}
.srow .dd{font-weight:700;width:66px;flex:none;color:var(--ink3);font-size:13px;line-height:1.35}
.srow.soon .dd{color:var(--crimson)}
.srow.past{opacity:.45}
.srow .st{flex:1;min-width:0;font-size:14px}
.srow .guess{font-size:10.5px;color:var(--ink3);display:block;margin-top:2px}
.srow .body{font-size:12.5px;color:var(--ink2);white-space:pre-line;margin-top:8px;display:none}
.srow[aria-expanded="true"] .body{display:block}

.calbig{width:100%;font:700 15px/1 var(--font);color:var(--bg);background:var(--navy);
        border:0;border-radius:14px;padding:16px;cursor:pointer;margin-bottom:10px}
.subs{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:12px}
.subs .st{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px!important}
.subs p{font-size:12.5px;color:var(--ink2);line-height:1.65;margin:0 0 10px!important}
.subs p.how{color:var(--ink3);font-size:12px;margin:10px 0 0!important}
.subs code{display:block;font:12px/1.5 var(--num);color:var(--ink);background:var(--surface2);
           border-radius:8px;padding:10px 12px;word-break:break-all;margin-bottom:10px}
.calbig:active{filter:brightness(.92)}
.calone{font:600 12.5px/1 var(--font);color:var(--navy);background:none;
        border:1px solid var(--navy);border-radius:9px;padding:9px 13px;cursor:pointer;margin-top:10px}
.calone:active{background:var(--surface2)}
.ver{display:flex;align-items:baseline;gap:10px;font-size:12.5px;color:var(--ink3);
     padding-bottom:11px;margin-bottom:11px!important;border-bottom:1px solid var(--rule)}
.ver b{margin-left:auto;font-family:var(--num);color:var(--ink);font-weight:700}
.notes{padding:0!important;overflow:hidden}
.notes.fresh{border-color:var(--gold)}
.nhead{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;
       font:700 13px/1 var(--font);color:var(--ink);padding:15px 16px;cursor:pointer;text-align:left}
.notes.fresh .nhead{background:var(--gold-bg);color:var(--gold)}
.nhead .nx{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--ink3)}
.notes.fresh .nhead .nx{color:var(--gold)}
.nbody{padding:2px 16px 14px}
.nver{padding-top:12px}
.nver + .nver{border-top:1px solid var(--rule);margin-top:12px}
.nver .nv{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.03em}
.nbody ul{margin:7px 0 0!important;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.nbody li{font-size:13px;color:var(--ink2);line-height:1.6}
.nbody li b{color:var(--ink)}
.noti{border-top:1px solid var(--rule);margin-top:12px;padding-top:12px}
.noti .ns{font-size:12px;color:var(--ink2);line-height:1.6}
.mini{font-size:12px;color:var(--ink3);line-height:1.7}
.ghost{font:inherit;font-size:12.5px;color:var(--ink2);background:none;border:1px solid var(--rule);
       border-radius:10px;padding:11px 14px;cursor:pointer;width:100%;margin-top:10px}

/* ── 하단 탭 ── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
    border-top:1px solid var(--rule);display:flex;
    padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;cursor:pointer;font:inherit;color:var(--ink3);
           height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button .ic{font-size:19px;line-height:1}
nav button .lb{font-size:10.5px;font-weight:600}
nav button[aria-selected="true"]{color:var(--navy)}
nav button:active{background:var(--surface2)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
       transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--bg);
       font-size:13px;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;
       transition:opacity .2s,transform .2s;z-index:40;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="app">
<header class="bar">
  <div>
    <div class="ttl">학점 관리</div>
    <div class="sub">학점은행제 · 컴퓨터공학 공학사</div>
  </div>
  <div class="sp"></div>
  <div class="net" id="net"><span class="nd"></span><span id="nt">온라인</span></div>
  <button class="pill go" id="install" hidden type="button">앱 설치</button>
</header>

<main>
  <section class="view on" id="v0"></section>
  <section class="view" id="v1"></section>
  <section class="view" id="v2"></section>
</main>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-v="0"><span class="ic">◎</span><span class="lb">현황</span></button>
  <button role="tab" aria-selected="false" data-v="1"><span class="ic">☰</span><span class="lb">항목</span></button>
  <button role="tab" aria-selected="false" data-v="2"><span class="ic">◷</span><span class="lb">일정</span></button>
</nav>

function 알림표시(){

  else if(p==="unsupported"){ 알림상태.textContent="이 브라우저는 알림을 지원하지 않습니다."; 알림켜기.hidden=true; }

    var reg = await navigator.serviceWorker.ready;
    // 크롬이 주기적으로 깨우도록 등록 (설치된 앱에서만 허용됩니다)
    var 주기 = "안 됨";

      if("periodicSync" in reg){
        var st = await navigator.permissions.query({name:"periodic-background-sync"});
        if(st.state==="granted"){
          await reg.periodicSync.register("학점점검",{minInterval:24*60*60*1000});
          주기 = "등록됨";
        } else { 주기 = "권한 없음(설치한 앱에서만 됩니다)"; }
      }
    }catch(e){ 주기 = "안 됨"; }
    reg.active && reg.active.postMessage({type:"알림검사", 강제:true});
    say("알림을 켰습니다. 주기 확인: " + 주기 + " · 앱을 열 때도 검사합니다.");

});

/* 자동 갱신 — 손댈 것이 없습니다.
   앱을 열거나 화면으로 되돌아올 때마다 새 판이 있는지 확인하고, 있으면 받아서
   스스로 한 번 새로고침합니다. 눌러 둔 상태는 기기에 저장돼 있어 그대로 남습니다. */
if("serviceWorker" in navigator){
  var 갱신중=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(갱신중) return; 갱신중=true;
    try{ sessionStorage.setItem("갱신됨","1"); }catch(e){}
    location.reload();
  });
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      // 앱으로 돌아올 때마다 새 판 확인
      document.addEventListener("visibilitychange",function(){
        if(!document.hidden) reg.update();
      });
      setInterval(function(){ reg.update(); }, 60*60*1000);
    }).catch(function(e){ console.warn("서비스워커 등록 실패:",e); });

    try{
      if(sessionStorage.getItem("갱신됨")){
        sessionStorage.removeItem("갱신됨");
        var t=document.getElementById("toast");
        t.textContent="새 버전으로 갱신됐습니다 ("+window.__HAKJEOM__.버전+")";
        t.classList.add("on");
        setTimeout(function(){ t.classList.remove("on"); },2600);
      }
    }catch(e){}
  });
}
</script>
</body>
</html>
