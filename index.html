<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3460" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0f16" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>학점 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<style>
:root{
  color-scheme:dark light;
  --bg:#0c0f16; --surface:#151a24; --surface2:#1d2431; --bar:#0f1420;
  --ink:#e7ebf4; --ink2:#adb9ce; --ink3:#7f8ca4;
  --rule:#262d3c; --navy:#93b7ea; --crimson:#ff8098;
  --gold:#efc366; --gold-bg:#2b2413; --green:#66d3a6;
  --done:#7fabe2; --doing:#3d63a0; --todo:#242b39;
  --nav-h:62px;
  --font:"Pretendard Variable",Pretendard,"Samsung Sans","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f3f5f9; --surface:#fff; --surface2:#e9eef6; --bar:#fff;
  --ink:#111726; --ink2:#3f4d66; --ink3:#5f6c82;
  --rule:#dbe1ec; --navy:#0f3460; --crimson:#bc1738;
  --gold:#8a5b00; --gold-bg:#fdf4dc; --green:#0d6b49;
  --done:#0f3460; --doing:#2f6db5; --todo:#d9e0ea;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
     word-break:keep-all;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app *{margin:0}

/* ── 앱바 ── */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--rule);
     padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
.bar .ttl{font-size:17px;font-weight:700;letter-spacing:-.01em}
.bar .sub{font-size:11px;color:var(--ink3);margin-top:1px!important}
.bar .sp{flex:1}
.pill{font:600 12px/1 var(--font);padding:9px 13px;border-radius:999px;border:1px solid var(--rule);
      background:var(--surface);color:var(--ink);cursor:pointer}
.pill.go{background:var(--navy);color:var(--bg);border-color:transparent}
/* hidden 속성이 항상 이기게 둡니다.
   .offline 에 display:flex 를 주는 바람에 브라우저 기본 [hidden]{display:none} 이 밀려서
   온라인인데도 '오프라인' 배지가 계속 떠 있었습니다(작성자 CSS 가 UA 기본을 항상 이깁니다).
   개별 선택자로 한 곳씩 막다 보면 또 빠뜨립니다 — 전역으로 한 번에 못박습니다. */
[hidden]{display:none!important}
.net{font-size:11px;display:flex;align-items:center;gap:5px;color:var(--green)}
.net .nd{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.net.off{color:var(--gold)}
.net.off .nd{background:var(--gold)}

/* ── 본문 ── */
main{padding:14px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);
     max-width:600px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px}
.card + .card,.card + .reqs,.reqs + .card,h2 + .card,h2 + .list,h2 + .sch{margin-top:10px}

.hero{display:flex;align-items:baseline;gap:9px}
.hero .n{font-family:var(--num);font-size:46px;font-weight:700;letter-spacing:-.05em;line-height:1}
.hero .of{font-size:15px;color:var(--ink3);font-family:var(--num)}
.hero .tag{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink3)}
.bar2{display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--todo);margin-top:14px}
.bar2 i{display:block;transition:flex-grow .4s cubic-bezier(.2,.8,.2,1)}
.bar2 .d{background:var(--done)}.bar2 .g{background:var(--doing)}
.keys{display:flex;flex-wrap:wrap;gap:6px 15px;margin-top:11px!important;font-size:12px;color:var(--ink2)}
.keys span{display:flex;align-items:center;gap:6px}
.keys b{font-family:var(--num);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

.reqs{display:grid;gap:8px}
.req{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:13px 15px}
.req .h{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--ink2)}
.req .h b{margin-left:auto;font-family:var(--num);font-size:16px;color:var(--ink)}
/* 게이지는 3층입니다 — 확보(인정완료) / 신청하면 / 계획대로 가면.
   확보만 보여주면 신청해도 화면이 안 움직여서 진행이 안 보입니다. */
.req .track{height:9px;border-radius:5px;background:var(--todo);margin-top:9px;overflow:hidden;display:flex}
.req .track i{display:block;height:100%;background:var(--done);transition:flex-grow .4s cubic-bezier(.2,.8,.2,1)}
.req .track i.g{background:var(--doing)}
.req .track i.p{background:var(--rule)}
.req .now{font-size:11.5px;color:var(--ink2);margin-top:7px!important}
.req .now b{font-family:var(--num);color:var(--ink)}
.fore{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.fore th{font-size:11px;font-weight:700;color:var(--ink3);text-align:right;padding:0 0 7px;letter-spacing:.04em}
.fore th:first-child{text-align:left}
.fore td{font-size:13px;padding:9px 0;border-top:1px solid var(--rule);text-align:right}
.fore td:first-child{text-align:left;color:var(--ink2)}
.fore td b{font-family:var(--num);font-size:15px}
.fore tr.fin td{border-top:2px solid var(--ink);font-weight:700}
.fore .plus{font-family:var(--num);color:var(--navy);font-size:12px}
.req.met .track i:first-child{background:var(--green)}
.req.short{border-color:var(--crimson)}
.req.short .track i:first-child{background:var(--crimson)}
.req .note{font-size:11.5px;color:var(--ink3);margin-top:7px!important}

h2{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--ink3);margin:20px 2px 8px!important}

.next{background:var(--surface);border:1px solid var(--gold);border-left:6px solid var(--gold);border-radius:16px;padding:16px 18px}
.next .d{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--crimson)}
.next .t{font-size:18px;font-weight:700;line-height:1.4;color:var(--ink);margin-top:5px!important}
.next .b{font-size:14px;line-height:1.75;color:var(--ink);margin-top:11px!important;white-space:pre-line}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;font:600 13px/1 var(--font);padding:9px 15px;border-radius:999px;cursor:pointer;
       border:1px solid var(--rule);background:var(--surface);color:var(--ink2)}
.fchip[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:transparent}

.list,.sch{background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:64px;
      padding:13px 15px;background:none;border:0;border-bottom:1px solid var(--rule);
      cursor:pointer;font:inherit;color:inherit}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface2)}
.item[hidden]{display:none}
/* 기본(예정) 라벨은 작은 굵은 글자라 대비가 4.5 이상이어야 합니다.
   --ink3 을 쓰니 라이트 모드에서 3.4 로 떨어졌습니다(검수에서 잡음). --ink2 로 올렸습니다. */
.mark{flex:none;min-width:62px;text-align:center;padding:6px 9px;border-radius:8px;
      font-size:11.5px;font-weight:700;line-height:1.2;
      color:var(--ink2);background:var(--todo);transition:background .2s,color .2s}
.item[data-s="인정완료"] .mark{background:var(--done);color:var(--bg)}
/* 파란 배경에 배경색 글씨를 얹었더니 대비가 2.6까지 떨어졌습니다(검수에서 잡음).
   흰 글씨로 바꾸고 라이트 모드의 --doing 을 진하게 내렸습니다. */
.item[data-s="신청완료"] .mark{background:var(--doing);color:#fff}
.item[data-s="취소예정"] .mark{background:var(--crimson);color:var(--bg)}
.item[data-s="취소완료"] .mark{background:var(--rule);color:var(--ink3)}
.item[data-s="취소완료"] .nm .n1,.item[data-s="취소완료"] .cr{text-decoration:line-through;color:var(--ink3)}
.cancel{font-size:10px;font-weight:700;color:var(--crimson);border:1px solid var(--crimson);
        border-radius:999px;padding:2px 7px}
.nm{flex:1;min-width:0}
.nm .n1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm .n2{font-size:11.5px;color:var(--ink3);margin-top:2px!important}
.item[data-s="인정완료"] .nm .n1{color:var(--ink2)}
.cr{font-family:var(--num);font-weight:700;font-size:17px;flex:none}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid currentColor}
.c-전공{color:var(--navy)}.c-교양{color:var(--crimson)}.c-일반{color:var(--ink3)}
.hoh{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold);
     border-radius:999px;padding:2px 7px}

.srow{width:100%;text-align:left;display:flex;gap:12px;padding:14px 15px;font:inherit;color:inherit;
      background:none;border:0;border-bottom:1px solid var(--rule);cursor:pointer}
.srow:last-child{border-bottom:0}
.srow:active{background:var(--surface2)}
.srow .dd{font-weight:700;width:66px;flex:none;color:var(--ink3);font-size:13px;line-height:1.35}
.srow.soon .dd{color:var(--crimson)}
.srow.past{opacity:.45}
.srow .st{flex:1;min-width:0;font-size:14px}
.srow .guess{font-size:10.5px;color:var(--ink3);display:block;margin-top:2px}
.srow .body{font-size:12.5px;color:var(--ink2);white-space:pre-line;margin-top:8px;display:none}
.srow[aria-expanded="true"] .body{display:block}

.calbig{width:100%;font:700 15px/1 var(--font);color:var(--bg);background:var(--navy);
        border:0;border-radius:14px;padding:16px;cursor:pointer;margin-bottom:10px}
.subs{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:12px}
.subs .st{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px!important}
.subs p{font-size:12.5px;color:var(--ink2);line-height:1.65;margin:0 0 10px!important}
.subs p.how{color:var(--ink3);font-size:12px;margin:10px 0 0!important}
.subs code{display:block;font:12px/1.5 var(--num);color:var(--ink);background:var(--surface2);
           border-radius:8px;padding:10px 12px;word-break:break-all;margin-bottom:10px}
.calbig:active{filter:brightness(.92)}
.calone{font:600 12.5px/1 var(--font);color:var(--navy);background:none;
        border:1px solid var(--navy);border-radius:9px;padding:9px 13px;cursor:pointer;margin-top:10px}
.calone:active{background:var(--surface2)}
.ver{display:flex;align-items:baseline;gap:10px;font-size:12.5px;color:var(--ink3);
     padding-bottom:11px;margin-bottom:11px!important;border-bottom:1px solid var(--rule)}
.ver b{margin-left:auto;font-family:var(--num);color:var(--ink);font-weight:700}
.notes{padding:0!important;overflow:hidden}
.notes.fresh{border-color:var(--gold)}
.nhead{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;
       font:700 13px/1 var(--font);color:var(--ink);padding:15px 16px;cursor:pointer;text-align:left}
.notes.fresh .nhead{background:var(--gold-bg);color:var(--gold)}
.nhead .nx{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--ink3)}
.notes.fresh .nhead .nx{color:var(--gold)}
.nbody{padding:2px 16px 14px}
.nver{padding-top:12px}
.nver + .nver{border-top:1px solid var(--rule);margin-top:12px}
.nver .nv{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.03em}
.nbody ul{margin:7px 0 0!important;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.nbody li{font-size:13px;color:var(--ink2);line-height:1.6}
.nbody li b{color:var(--ink)}
.noti{border-top:1px solid var(--rule);margin-top:12px;padding-top:12px}
.noti .ns{font-size:12px;color:var(--ink2);line-height:1.6}
.mini{font-size:12px;color:var(--ink3);line-height:1.7}
.ghost{font:inherit;font-size:12.5px;color:var(--ink2);background:none;border:1px solid var(--rule);
       border-radius:10px;padding:11px 14px;cursor:pointer;width:100%;margin-top:10px}

/* ── 수강 (주차별 진도) ── */
.sc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sc-nm{font-size:16px;font-weight:700}
.sc-meta{font-size:11.5px;color:var(--ink3)}
.sc-badge{margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.sc-badge.now{background:var(--doing);color:#fff}
.sc-badge.soon{background:var(--todo);color:var(--ink2)}
.sc-badge.done{background:var(--rule);color:var(--ink3)}
.sc-memo{font-size:12px;color:var(--ink2);margin-top:8px!important;line-height:1.55}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.wk{display:flex;flex-direction:column;gap:2px;align-items:center;padding:8px 3px;border-radius:9px;
    background:var(--surface2);border:1px solid transparent}
.wk .wn{font-size:11px;font-weight:700;color:var(--ink2)}
.wk .wd{font-size:10px;color:var(--ink3);font-family:var(--num);letter-spacing:-.02em}
.wk.past{opacity:.45}
.wk.cur{background:var(--gold-bg);border-color:var(--gold)}
.wk.cur .wn{color:var(--gold)}
.weeklist{margin-top:12px}
.wrow{display:flex;align-items:baseline;gap:9px;padding:9px 6px;border-top:1px solid var(--rule)}
.wrow:first-child{border-top:0}
.wr-n{flex:none;width:32px;font-size:12px;font-weight:700;color:var(--ink2)}
.wr-d{flex:none;width:84px;font-size:11px;color:var(--ink2);font-family:var(--num);letter-spacing:-.02em}
.wr-t{flex:1;font-size:13px;color:var(--ink);line-height:1.45}
.wr-badge{font-style:normal;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.wr-badge.exam{background:var(--crimson);color:var(--bg)}
.wr-badge.task{background:var(--gold);color:var(--bg)}
.wr-badge.disc{background:var(--navy);color:var(--bg)}
/* 접기 헤더 · 진도 막대 */
.subc .sc-head{cursor:pointer;align-items:center}
.sc-left{flex:1;min-width:0}
.sc-chev{flex:none;color:var(--ink3);font-size:12px;margin-left:2px}
.sc-progline{display:flex;margin-top:11px}
.sc-prog{font-size:11.5px;color:var(--ink2);font-family:var(--num);font-weight:700}
.subc.alldone .sc-prog{color:var(--green)}
.sc-track{height:5px;border-radius:3px;background:var(--todo);margin-top:6px;overflow:hidden}
.sc-track i{display:block;height:100%;width:0;background:var(--doing);transition:width .35s ease}
.subc.alldone .sc-track i{background:var(--green)}
.sc-body{margin-top:12px}
/* 체크 (상세 행) */
.wrow{cursor:pointer}
.ck{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--rule);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;line-height:1}
.wrow.done>.ck{background:var(--green);border-color:var(--green)}
.wrow.done .wr-t{color:var(--ink3);text-decoration:line-through}
.wrow.done .wr-n{color:var(--ink3)}
.wrow.miss>.ck{border-color:var(--crimson)}
.wrow.miss{background:rgba(188,23,56,.07);border-radius:8px}
.wrow.miss .wr-n{color:var(--crimson)}
/* 체크 (그리드 셀) */
.wk{cursor:pointer}
.wk.done{background:var(--green);border-color:var(--green)}
.wk.done .wn,.wk.done .wd{color:#fff}
.wk.miss{border-color:var(--crimson);background:rgba(188,23,56,.07)}
.wk.miss .wn{color:var(--crimson)}
/* 이번 주 수강 (현황) */
#thisweek{padding:4px 8px}
.twrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
       cursor:pointer;font:inherit;color:inherit;padding:10px 4px;border-top:1px solid var(--rule)}
.twrow:first-child{border-top:0}
.tw-ck{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--rule);
       display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;line-height:1}
.tw-ck.on{background:var(--green);border-color:var(--green)}
.tw-t{flex:1;font-size:13.5px;line-height:1.4;color:var(--ink)}
.tw-t b{font-weight:700}
.tw-tag{flex:none;font-size:10px;font-weight:700;color:var(--ink3);border:1px solid var(--rule);
        border-radius:999px;padding:3px 8px;white-space:nowrap}
.twrow.nextw .tw-t{color:var(--ink2)}
.twrow.nextw .tw-t b{font-weight:600}
.wrow.past{opacity:.78}
/* 안 들은 지난 주차는 흐리게 하지 않습니다 — 오히려 눈에 띄어야 합니다. */
.wrow.past.miss{opacity:1}
.wrow.cur{background:var(--gold-bg);border-radius:8px;border-top-color:transparent}
.wrow.cur .wr-n{color:var(--gold)}

/* ── 하단 탭 ── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
    border-top:1px solid var(--rule);display:flex;
    padding-bottom:env(safe-area-inset-bottom)}
/* 로드맵 */
.rm-goal{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
         background:var(--gold-bg);border:1px solid var(--gold);border-radius:12px;padding:13px 15px}
.rm-goal .g1{font:700 14px/1.4 var(--font);color:var(--ink)}
.rm-goal .g2{font-size:12px;color:var(--ink2)}
.rm-bal{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:1px;
        background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:9px}
.rm-bc{background:var(--surface);padding:11px 9px;text-align:center}
.rm-bc .v{font:700 18px/1 var(--num);letter-spacing:-.02em}
.rm-bc .k{font-size:10.5px;color:var(--ink3);margin-top:4px!important}
.rm-bc .d{font-size:10px;color:var(--navy);margin-top:2px!important;font-weight:700}
.rm-tl{position:relative;padding-left:22px;margin-top:4px}
.rm-tl::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:var(--rule)}
.rm-ev{position:relative;padding:11px 0}
.rm-ev::before{content:"";position:absolute;left:-21px;top:16px;width:10px;height:10px;border-radius:50%;
               background:var(--surface);border:2px solid var(--rule2,var(--rule))}
.rm-ev.key::before{background:var(--crimson);border-color:var(--crimson)}
.rm-ev.fin::before{background:var(--green);border-color:var(--green)}
.rm-ev .w{font:700 11.5px/1 var(--num);color:var(--crimson)}
.rm-ev.fin .w{color:var(--green)}
.rm-ev .h{font-weight:700;font-size:14px;margin-top:4px!important}
.rm-ev .d{font-size:12px;color:var(--ink2);margin-top:3px!important;line-height:1.6}

] 지울 일정 — 남아 있으면 손으로 지우세\r\n 요\r\nEND:VEVENT\r\nBEGIN:VEVENT\r\nUID:hakjeom-2028-01-04-14@e-hakjeom.local\r\nORGANIZER;CN=학점은행제 로드맵:mailto:hakjeom@e-hakjeom.local\r\nSEQUENCE:99999\r\nDTSTAMP:20260820T000000Z\r\nDTSTART;TZID=Asia/Seoul:20260820T000000\r\nSTATUS:CANCELLED\r\nSUMMARY:[학점] 지울 일정 — 남아 있으면 손으로 지우세\r\n 요\r\nEND:VEVENT\r\nBEGIN:VEVENT\r\nUID:hakjeom-2028-01-04-16@e-hakjeom.local\r\nORGANIZER;CN=학점은행제 로드맵:mailto:hakjeom@e-hakjeom.local\r\nSEQUENCE:99999\r\nDTSTAMP:20260820T000000Z\r\nDTSTART;TZID=Asia/Seoul:20260820T000000\r\nSTATUS:CANCELLED\r\nSUMMARY:[학점] 지울 일정 — 남아 있으면 손으로 지우세\r\n 요\r\nEND:VEVENT\r\nBEGIN:VEVENT\r\nUID:hakjeom-2028-01-04-1@e-hakjeom.local\r\nORGANIZER;CN=학점은행제 로드맵:mailto:hakjeom@e-hakjeom.local\r\nSEQUENCE:99999\r\nDTSTAMP:20260820T000000Z\r\nDTSTART;TZID=Asia/Seoul:20260820T000000\r\nSTATUS:CANCELLED\r\nSUMMARY:[학점] 지울 일정 — 남아 있으면 손으로 지우세\r\n 요\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n","지울건수":42,"현황":{"총필요":140,"보유":54,"이번학기":23,"교양필요":30,"교양확보예정":20,"전공필요":60,"전공계획":69,"비용":301000},"판":"2.11","변경이력":[{"판":"2.11","날짜":"2026-08-31","내용":["**효과적인성인교육방법 15주 강의계획서**가 들어갔습니다. 건양사이버대 강의실 캡처에서 옮긴 값입니다.","**8주차 중간고사 · 15주차 기말고사**가 표시되고, 나머지 13주는 매주 형성평가가 있어 퀴즈 칸으로 함께 뜹니다."]},{"판":"2.10","날짜":"2026-08-31","내용":["**수강 카드를 펼치거나 접은 상태가 과목별로 저장됩니다.** 열 때마다 진행 중인 과목만 자동으로 펼쳐지던 걸 직접 접어 두면 다음에 열 때도 접힌 채로 유지됩니다."]},{"판":"2.9","날짜":"2026-08-31","내용":["**인공지능 15주 강의계획서**가 들어갔습니다. 한동대 강의실 캡처에서 옮긴 값입니다.","**8주차 중간고사 · 15주차 기말고사**가 표시되고, 나머지 13주는 다른 과목처럼 퀴즈 칸이 함께 뜹니다."]},{"판":"2.8","날짜":"2026-08-30","내용":["**「로드맵」이 앱 안에 들어왔습니다.** 현황 탭 아래에서 140학점까지 가는 길을 바로 볼 수 있습니다 — 지금 가진 54학점 내역, 시간표, 놓치면 안 되는 것 6가지.","**빅데이터개론·문화관광론에도 퀴즈 칸**이 생겼습니다. 이제 네 과목 모두 주차별로 퀴즈를 따로 체크할 수 있습니다."]},{"판":"2.7","날짜":"2026-08-29","내용":["**보유 학점이 42가 아니라 54였습니다.** 학점은행제 공식 기록을 확인해 **마산대 12학점**(전공선택 2 · 일반선택 10, 2007년)을 넣었습니다 — 앱에 아예 빠져 있던 학점입니다.","**「K-MOOC 기이수분 22」는 사실 해군 군 교육 학점**이었습니다 (해군제1군사교육단·정보통신학교, 2008~09). 이름을 바로잡았습니다.","**12학점이 남아서 계획을 줄였습니다** — 2027(하) 7학점은 아예 없애고, 2027(상)도 24에서 19학점(교양 10 + 자유 9)으로 축소했습니다.","이제 **2027년 7월이면 140학점이 다 찹니다.** 마지막 한 학기를 통째로 안 들어도 됩니다."]},{"판":"2.6","날짜":"2026-08-29","내용":["**퀴즈를 따로 체크**할 수 있습니다. 주차 행 오른쪽 「퀴즈」 칩을 누르면 됩니다 — 강의만 듣고 퀴즈를 빼먹는 일을 막으려고 분리했습니다.","진도에 **퀴즈 개수**가 함께 뜹니다 (예: 완료 3/15주 · 퀴즈 2/13).","**과제·시험이 이번 주나 다음 주에 있으면** 「다음 할 일」 맨 위에 빨간 카드로 띄웁니다. 남은 날짜도 같이 보여줍니다.","**기간이 지나가는 안 푼 퀴즈**는 노란 카드로 따로 알려줍니다 — 출석 인정 2주가 지나면 못 풉니다."]},{"판":"2.5","날짜":"2026-08-29","내용":["**실용한문 · 현대인의정신건강 15주 상세**가 들어갔습니다. 성신여대 강의계획 캡처에서 옮긴 값입니다.","두 과목 모두 **8주차 중간고사 · 15주차 기말고사**, 실용한문은 객관식 25문제(30점), 현대인의정신건강은 15문제(35점) · 12주차 과제 표시가 붙었습니다.","현대인의정신건강 9~11·13·14주차는 캡처에 강의명이 없어 임시로 「N주차 강의」로 둡니다 — 추후 실제 강의명이 확인되면 채워넣어야 합니다."]},{"판":"2.4","날짜":"2026-08-20","내용":["'다음 할 일'이 **진짜 해야 할 일**만 보여줍니다 — 이미 다 신청한 **신청 마감(9/6·9/13)은 뺐습니다**.","'다음 할 일'에 **다음 주에 들을 강의**도 미리 뜹니다 — 이번 주(체크) + 다음 주(미리보기)."]},{"판":"2.3","날짜":"2026-08-20","내용":["'다음 할 일'에 뜨던 **9월 1일 「깃허브 배포 확인」을 없앴습니다** — 이미 배포돼 있어 더 볼 필요가 없습니다."]},{"판":"2.2","날짜":"2026-08-19","내용":["**「다음 할 일」 안에 이번 주 수강**이 함께 뜹니다 — 지금 들어야 할 과목·주차가 맨 위에, 그 아래 가까운 일정.","**각 강의 종강일**이 일정·알림에 들어갔습니다 — 인하 11/29 · 성신 12/11 · 한동/건양 12/13 · 남서울 12/20."]},{"판":"2.1","날짜":"2026-08-19","내용":["수강 화면에서 **들은 주차를 눌러 체크**할 수 있습니다 — 진도가 이 기기에 저장되고, 과목마다 **완료 개수·막대**가 뜹니다.","**지난주인데 안 들은 주차는 빨갛게** 표시돼 밀린 걸 바로 압니다.","과목 카드를 **접었다 폈다** 할 수 있고, 진행 중인 과목만 펼쳐 둡니다(양이 많아서요).","현황에 **「이번 주 수강」** 이 생겼습니다 — 지금 들어야 할 과목·주차가 뜨고, 누르면 수강 화면으로 갑니다.","**중간고사·레포트·토론·기말** 마감이 일정·알림에 들어갔습니다 — 폰·PC·캘린더가 미리 챙깁니다."]},{"판":"2.0","날짜":"2026-08-19","내용":["**문화관광론**도 주차별 제목이 전부 들어갔습니다 — 이제 개강한 **2과목(빅데이터개론·문화관광론) 완성**입니다.","**「토론」 배지**가 생겼습니다 — 문화관광론 7주 토론(9/28~)처럼 시험·과제 외 활동도 표시됩니다.","문화관광론 핵심 일정: **중간 10/5~10/11 · 레포트 10/12~10/25 · 토론 9/28~ · 기획서(기말) 11/23~11/29**."]},{"판":"1.9","날짜":"2026-08-19","내용":["**빅데이터개론**은 수강 화면에서 **주차별 제목까지** 펼쳐집니다 — 강의실 강의계획서를 확인해 15주 전부 넣었습니다.","**중간고사(8주)·기말고사(15주)** 는 빨간 배지, **레포트(9주)** 는 과제 배지로 표시됩니다.","나머지 과목은 개강 후 강의계획서가 열리면 같은 방식으로 채웁니다(지금은 날짜만)."]},{"판":"1.8","날짜":"2026-08-19","내용":["**'수강' 화면**이 생겼습니다 — 신청한 8과목의 **주차별 수강일**을 보여주고, **오늘이 몇 주차**인지 자동으로 강조합니다.","강의기간은 각 강좌 공개 페이지에서 가져왔습니다(모두 15주). **주차별 세부 주제·시험 날짜는 강의실(로그인)** 에서 확인하세요."]},{"판":"1.7","날짜":"2026-08-19","내용":["**효과적인성인교육방법**도 신청 완료로 바꿨습니다 — 이제 2026(하) **8과목 전부 신청 완료**입니다."]},{"판":"1.6","날짜":"2026-08-17","내용":["**커피학개론 · 평생교육론 · 인공지능**을 신청함으로 바꿨습니다 — 2026(하) 8과목이 모두 신청 완료입니다.","배포처를 **깃허브 페이지**로 옮겼습니다 — 올리면 바로 반영되어 따로 배포할 일이 없습니다.","9월 1일 일정이 **배포 확인**으로 바뀌었습니다. 주소가 바뀌었으니 폰의 옛 앱은 지우고 새로 설치하세요.","「다음 할 일」 상자의 **글씨가 잘 보이도록** 고쳤습니다 — 금색 배경을 걷어내고 **왼쪽 굵은 띠**로만 강조합니다. 글씨는 흰색 계열 고대비로, 크기와 줄 간격도 키웠습니다.","**알림·오프라인이 이제야 실제로 작동합니다.** 서비스워커에 문법 오류가 있어 판 1.4부터 한 번도 등록되지 않고 있었습니다 — 고쳤습니다.","밝은 화면에서 **흐릿하던 회색 글씨**를 조금 진하게 했습니다 — 명암비 기준에 살짝 못 미치던 4곳입니다."]},{"판":"1.5","날짜":"2026-08-07","내용":["새 판이 나오면 **무엇이 바뀌었는지** 이 자리에 뜹니다.","일정에 **9월 1일 앱 배포**가 들어갔습니다 — 8월엔 배포 용량이 차서 미뤘습니다."]},{"판":"1.4","날짜":"2026-08-07","내용":["캘린더 없이 **앱이 직접 알림**을 울립니다 — 앱 정보에서 「알림 켜기」를 누르세요.","**예상 진행** — 신청하면 언제 얼마가 되는지 시점별로 보여줍니다.","졸업요건 막대가 3층이 됐습니다 — 지금 확보 / 신청한 것까지 / 계획대로면.","캘린더는 파일 넣기 대신 **주소 구독**으로 바꿨습니다. 넣을 때마다 중복이 생기던 것을 없앴습니다."]},{"판":"1.3","날짜":"2026-08-07","내용":["항목 상태를 네모 대신 **글자**로 — 인정됨 · 신청함 · 예정 · 취소할 것.","연결 상태를 **온라인/오프라인 둘 다** 보여줍니다. 온라인인데 계속 오프라인이라고 뜨던 것을 고쳤습니다.","**반도체공학Ⅰ**이 「취소할 것」으로 표시됩니다.","날짜 표기를 한글로 — D-3 → 3일 뒤, 08/10 → 8월 10일."]},{"판":"1.2","날짜":"2026-08-07","내용":["새 판이 나오면 **스스로 갱신**합니다. 버튼을 누를 필요가 없습니다.","앱 정보에 **버전**이 보입니다. 갱신됐는지 눈으로 확인할 수 있습니다."]},{"판":"1.1","날짜":"2026-08-07","내용":["일정을 **캘린더로 넘기는** 기능이 생겼습니다.","**2026(하)를 23학점으로 재설계** — 교양 20 + 전공 3. 독학사 한 과목이 떨어져도 안전해졌습니다."]},{"판":"1.0","날짜":"2026-08-07","내용":["첫 판 — 현황 · 항목 · 일정 세 화면. 항목을 눌러 상태를 바꾸면 졸업요건이 바로 갱신됩니다."]}],"인정순서":["지금","2027.1월","2027.7월"],"인정시점":{"컴퓨터시스템기사":"지금","마산대 전공학점":"지금","마산대 일반학점":"지금","군 교육 (해군)":"지금","빅데이터개론":"2027.1월","문화관광론":"2027.1월","실용한문":"2027.1월","현대인의정신건강":"2027.1월","커피학개론":"2027.1월","평생교육론":"2027.1월","인공지능":"2027.1월","효과적인성인교육방법":"2027.1월","정보처리기사":"2027.7월","네트워크관리사 2급":"2027.7월","독학사 2과정 2과목":"2027.7월","2027(상) K-MOOC /* 캘린더로 바로 보내기 — 안드로이드 공유 시트에 파일을 얹습니다.
   받은 파일을 찾아 누를 필요 없이 한 번에 캘린더 앱으로 넘어갑니다.
   공유를 못 쓰는 브라우저(데스크톱 등)에서는 내려받기로 물러섭니다.
   .ics 안에 알림(VALARM)이 들어 있어 공유로 넘겨도 알림이 따라갑니다. */
async function 캘린더로보내기(내용, 파일이름){
  try{
    var f = new File([내용], 파일이름, { type: "text/calendar" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], title: "학점은행제 일정" });
      return "보냄";
    }
  }catch(e){
    if (e && e.name === "AbortError") return "취소";
  }
  return 캘린더담기(내용, 파일이름) ? "받음" : "막힘";
}
function 결과말(r, 성공말){

       : r === "받음" ? "파일로 받았습니다. 그 파일을 열면 캘린더에 들어갑니다."
       : "이 브라우저에서는 막혀 있습니다. 설치한 앱에서 눌러 주세요.";
}

/* 캘린더에 담기 — .ics 를 내려받으면 안드로이드가 캘린더 앱으로 넘겨줍니다.

   .ics 내용은 파이썬(일정생성.py)이 만들어 심어 둔 것을 그대로 씁니다. */
function 캘린더담기(내용, 파일이름){
  try{
    var url=URL.createObjectURL(new Blob([내용],{type:"text/calendar;charset=utf-8"}));
    var a=document.createElement("a");
    a.href=url; a.download=파일이름; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); },10000);
    return true;
  }catch(e){ return false; }
}

/* 중요 알림 — 과제·시험처럼 놓치면 점수가 날아가는 것만 위에 따로 띄웁니다.

   2) 지난 주차인데 아직 안 푼 퀴즈가 있으면 노란 카드 (기간 지나면 못 풉니다) */
function 중요알림(){
  var box=document.getElementById("alerts"); if(!box) return; box.innerHTML="";
  var 일=864e5, 오늘=new Date(); 오늘.setHours(0,0,0,0);
  var 카드=[];

  (D.수강강좌||[]).forEach(function(c){
    var 상세=D.주차상세&&D.주차상세[c.과목]; if(!상세) return;
    var p=c.시작.split("-"), s=new Date(+p[0],+p[1]-1,+p[2]);
    var 현주=오늘<s ? 0 : Math.floor((오늘-s)/(7*일))+1;
    if(현주<1) return;

    /* 과제·시험 — 이번 주 또는 다음 주 */
    [현주, 현주+1].forEach(function(w,idx){
      if(w<1 || w>c.주차) return;
      var info=상세[w-1]; if(!info || !info.유형) return;
      if(info.유형!=="과제" && info.유형!=="시험" && info.유형!=="토론") return;
      if(완료(c.과목,w)) return;                       // 이미 했으면 안 띄움
      var 시작=new Date(s.getTime()+(w-1)*7*일);
      var 마감=new Date(시작.getTime()+13*일);          // 출석 인정 2주
      var 남=Math.round((마감-오늘)/일);
      카드.push({ 급함:true, 아이콘:info.유형==="시험"?"📝":(info.유형==="토론"?"💬":"📌"),
        제목:c.과목+" "+w+"주 "+info.유형,
        본문:info.제목,
        꼬리:(idx===0?"이번 주":"다음 주")+" · "+(남>=0? 남+"일 남음":"기간 지남"),
        정렬:남 });
    });

    /* 안 푼 퀴즈 — 지난 주차만 (이번 주는 아직 시간 있음) */
    var 밀린=[];
    for(var i=1;i<현주 && i<=c.주차;i++){

    }

        제목:c.과목+" 안 푼 퀴즈 "+밀린.length+"개",

        꼬리:"출석 인정 기간(2주)이 지나면 못 풉니다",
        정렬:99 });
    }
  });

  if(!카드.length){ box.remove(); return; }
  카드.sort(function(a,b){ return a.정렬-b.정렬; });
  카드.slice(0,4).forEach(function(k){

    if(k.본문) w.appendChild(el("div","a2",k.본문));
    w.appendChild(el("div","a3",k.꼬리));

    a.addEventListener("click",function(){ tap(); document.querySelector("nav button[data-v='3']").click(); });
    box.appendChild(a);

}

        /* 퀴즈가 있는 주차엔 별도 체크칩. 행 클릭과 겹치지 않게 stopPropagation 합니다. */
        if(info.퀴즈){

    head.addEventListener("click",function(){

<script>
/* 자동 갱신 — 손댈 것이 없습니다.
   앱을 열거나 화면으로 되돌아올 때마다 새 판이 있는지 확인하고, 있으면 받아서
   스스로 한 번 새로고침합니다. 눌러 둔 상태는 기기에 저장돼 있어 그대로 남습니다. */
if("serviceWorker" in navigator){
  var 갱신중=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(갱신중) return; 갱신중=true;
    try{ sessionStorage.setItem("갱신됨","1"); }catch(e){}
    location.reload();
  });
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      // 앱으로 돌아올 때마다 새 판 확인
      document.addEventListener("visibilitychange",function(){
        if(!document.hidden) reg.update();
      });
      setInterval(function(){ reg.update(); }, 60*60*1000);
    }).catch(function(e){ console.warn("서비스워커 등록 실패:",e); });

    try{
      if(sessionStorage.getItem("갱신됨")){
        sessionStorage.removeItem("갱신됨");
        var t=document.getElementById("toast");
        t.textContent="새 버전으로 갱신됐습니다 ("+window.__HAKJEOM__.버전+")";
        t.classList.add("on");
        setTimeout(function(){ t.classList.remove("on"); },2600);
      }
    }catch(e){}
  });
}
</script>
